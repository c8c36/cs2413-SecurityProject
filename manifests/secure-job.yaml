apiVersion: batch/v1
kind: Job
metadata:
  name: calculation
  namespace: secure-jobs
spec:
  template:
    spec:
      restartPolicy: Never

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: calculation
          image: example/calculation:1.0

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
