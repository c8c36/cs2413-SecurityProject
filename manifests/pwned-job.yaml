apiVersion: batch/v1
kind: Job
metadata:
  name: oops-hijacked-credentials
  namespace: default
spec:
  template:
    metadata:
      name: oops-hijacked-credentials
      namespace: default
    spec:
      restartPolicy: Never
      containers:
        - name: oops
          image: python/python:3.15-bookworm
          command: ["bin/bash", "-c", "--"]
          args: ["while true; do sleep 60; done;"]
      serviceAccountName: kube-system
      automountServiceAccountToken: true
