# security.worker/jobs-readonly-rootfs: "true"
#
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: read-only-rootfs.security.worker
spec:
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced

  variables:
    - name: containers
      expression: >
        object.spec.template.spec.containers +
        (
          has(object.spec.template.spec.initContainers)
            ? object.spec.template.spec.initContainers
            : []
        )

  validations:
    - expression: >
        variables.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem
        )
      message: "Every container must use a read-only root filesystem."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: read-only-rootfs.bind.worker.security
spec:
  policyName: read-only-rootfs.security.worker

  matchResources:
    namespaceSelector:
      matchLabels:
        security.worker/jobs-readonly-rootfs: "true"

  validationActions:
    - Deny
    - Audit
