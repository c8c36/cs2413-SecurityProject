apiVersion: v1
kind: Namespace
metadata:
  name: unsafe-jobs-prod
  labels:
    kubernetes.io/metadata.name: unsafe-jobs-prod
    security.worker/jobs-readonly-rootfs: "true"
    security.worker/jobs-remove-tokens-access: "true"
    security.worker/jobs-restrict-volume-access: "true"
    security.worker/jobs-strict-security-context: "true"

spec:
  finalizers:
    - kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strict-job-ctl
  namespace: unsafe-jobs-prod
rules:
  - verbs: ["get", "list", "watch", "create"]
    apiGroups: ["batch"]
    resources: ["jobs"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strict-job-ctl
  namespace: unsafe-jobs-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strict-job-ctl
  namespace: unsafe-jobs-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strict-job-ctl
subjects:
  - kind: ServiceAccount
    name: strict-job-ctl
    namespace: unsafe-jobs-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-account-token-canary
  namespace: unsafe-jobs-prod
data:
  # Realisticly long token - 1
  token: 
---
apiVersion: v1
kind: Pod
metadata:
  name: strict-pod
  namespace: unsafe-jobs-prod
spec:
  serviceAccountName: strict-job-ctl
  automountServiceAccountToken: false

  containers:
    - name: runtime
      image: python:3.15-bookworm
      command: ["bin/bash", "-c", "--"]
      args: ["while true; do sleep 60; done;"]

      volumeMounts:
        # NOTE: FAR FROM IDEAL LOCATION. Usually it should mask as garbage value in
        # the current environment. I.e. /tmp/startup/log.hash
        - name: real-service-account-token
          mountPath: /var/run/application-id
          readOnly: true

        - name: honeypot-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true

  volumes:
    - name: real-service-account-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: https://kubernetes.default.svc
              expirationSeconds: 600
    - name: honeypot-token
      configMap:
        name: service-account-token-canary
        items:
          - key: token
            path: token
